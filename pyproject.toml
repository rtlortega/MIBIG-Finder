[project]
name = "mibig-finder"
version = "0.0.1"
description = "Match MS/MS spectra and chemical structures against a MIBiG-linked library."
requires-python = ">=3.11"
dependencies = [
    "matchms",
    "rdkit",
    "pandas",
    "pyarrow",
    "pydantic",
    "typer",
]

[project.scripts]
mibig-finder = "mibig_finder.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mibig_finder"]